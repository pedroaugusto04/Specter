services:
  postgres:
    image: postgres:16-alpine
    container_name: specter-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-specter}
    ports:
      - '${POSTGRES_PORT:-5445}:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./backend/drizzle/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-specter}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: specter-redis-dev
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: specter-backend-dev
    restart: unless-stopped
    command: ['npm', 'run', 'dev']
    environment:
      NODE_ENV: development
      PORT: 3001
      HOST: 0.0.0.0
      CORS_ORIGIN: 'http://localhost:3000,http://localhost:3005'
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-specter}
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      COMPILER_PROVIDER: ${COMPILER_PROVIDER:-agy}
      AGY_CLI_PATH: agy
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-console}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NOTIFICATION_FROM_EMAIL: ${NOTIFICATION_FROM_EMAIL:-onboarding@resend.dev}
      ZENROWS_API_KEY: ${ZENROWS_API_KEY:-}
      SCRAPERAPI_KEY: ${SCRAPERAPI_KEY:-}
      SCRAPINGBEE_API_KEY: ${SCRAPINGBEE_API_KEY:-}
      CRAWLBASE_TOKEN: ${CRAWLBASE_TOKEN:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      ACQUISITION_MAX_ATTEMPTS: ${ACQUISITION_MAX_ATTEMPTS:-3}
      ACCESS_BLOCK_THRESHOLD: ${ACCESS_BLOCK_THRESHOLD:-2}
      ACCESS_BLOCK_COOLDOWN_MINUTES: ${ACCESS_BLOCK_COOLDOWN_MINUTES:-60}
      COMPILATION_MAX_ATTEMPTS: ${COMPILATION_MAX_ATTEMPTS:-3}
      COMPILATION_QUEUE_MAX_ATTEMPTS: ${COMPILATION_QUEUE_MAX_ATTEMPTS:-3}
    ports:
      - '3001:3001'
    volumes:
      - ./backend:/app
      - ./packages/contracts:/packages/contracts
      - /app/node_modules
      - /home/pedroduarte/.local/bin/agy:/usr/local/bin/agy:ro
      - agy_profile:/root/.gemini
      - /tmp/scraper_jobs:/tmp/scraper_jobs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    container_name: specter-frontend-dev
    restart: unless-stopped
    command: ['npm', 'run', 'dev']
    environment:
      NODE_ENV: development
      HOSTNAME: '0.0.0.0'
      PORT: '3000'
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      WATCHPACK_POLLING: 'true'
    ports:
      - '3005:3000'
    volumes:
      - ./frontend:/app
      - ./packages/contracts:/packages/contracts
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_dev_data:
  redis_dev_data:
  agy_profile:
