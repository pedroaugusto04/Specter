services:
  postgres:
    image: postgres:16-alpine
    container_name: specter-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-specter}
    ports:
      - '${POSTGRES_PORT:-5445}:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-specter}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: specter-redis-dev
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: specter-backend-dev
    restart: unless-stopped
    command: ['sh', '-c', 'npm run db:migrate && npm run dev']
    environment:
      NODE_ENV: development
      PORT: 3001
      HOST: 0.0.0.0
      CORS_ORIGIN: 'http://localhost:3000,http://localhost:3005'
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-specter}
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REALTIME_REDIS_TIMEOUT_MS: ${REALTIME_REDIS_TIMEOUT_MS:-5000}
      COMPILER_PROVIDER: ${COMPILER_PROVIDER:-api}
      COMPILER_TIMEOUT_MS: ${COMPILER_TIMEOUT_MS:-300000}
      COMPILER_API_MODEL: ${COMPILER_API_MODEL:-}
      COMPILER_API_KEY: ${COMPILER_API_KEY:-}
      COMPILER_API_BASE_URL: ${COMPILER_API_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      COMPILER_API_MAX_RETRIES: ${COMPILER_API_MAX_RETRIES:-3}
      COMPILER_API_RETRY_BASE_DELAY_MS: ${COMPILER_API_RETRY_BASE_DELAY_MS:-1000}
      COMPILER_API_RETRY_MAX_DELAY_MS: ${COMPILER_API_RETRY_MAX_DELAY_MS:-10000}
      COMPILER_RATE_LIMIT_RETRY_DELAY_MS: ${COMPILER_RATE_LIMIT_RETRY_DELAY_MS:-120000}
      EVALS_LIVE_MODELS_ENABLED: ${EVALS_LIVE_MODELS_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-console}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NOTIFICATION_FROM_EMAIL: ${NOTIFICATION_FROM_EMAIL:-onboarding@resend.dev}
      ZENROWS_API_KEY: ${ZENROWS_API_KEY:-}
      SCRAPERAPI_KEY: ${SCRAPERAPI_KEY:-}
      SCRAPINGBEE_API_KEY: ${SCRAPINGBEE_API_KEY:-}
      CRAWLBASE_TOKEN: ${CRAWLBASE_TOKEN:-}
      DECODO_API_KEY: ${DECODO_API_KEY:-}
      UNBLOCKER_TIMEOUT_MS: ${UNBLOCKER_TIMEOUT_MS:-120000}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTP_FALLBACK_PROXY: ${HTTP_FALLBACK_PROXY:-}
      ACQUISITION_MAX_ATTEMPTS: ${ACQUISITION_MAX_ATTEMPTS:-5}
      ACCESS_BLOCK_THRESHOLD: ${ACCESS_BLOCK_THRESHOLD:-2}
      ACCESS_BLOCK_COOLDOWN_MINUTES: ${ACCESS_BLOCK_COOLDOWN_MINUTES:-60}
      EXTRACTION_TIMEOUT_MS: ${EXTRACTION_TIMEOUT_MS:-300000}
      PLAYWRIGHT_TIMEOUT_MS: ${PLAYWRIGHT_TIMEOUT_MS:-120000}
      HTTP_MAX_RESPONSE_BYTES: ${HTTP_MAX_RESPONSE_BYTES:-10485760}
      RATE_LIMIT_PROBE_MAX: ${RATE_LIMIT_PROBE_MAX:-10}
      EXTRACTION_ACTION_TIMEOUT_MS: ${EXTRACTION_ACTION_TIMEOUT_MS:-20000}
      COMPILATION_BUDGET_MS: ${COMPILATION_BUDGET_MS:-420000}
      CONFIGURATION_MAX_DECISIONS: ${CONFIGURATION_MAX_DECISIONS:-6}
      CONFIGURATION_MAX_INPUT_CHARS: ${CONFIGURATION_MAX_INPUT_CHARS:-250000}
      CONFIGURATION_REVIEW_RESERVE_MS: ${CONFIGURATION_REVIEW_RESERVE_MS:-30000}
      COMPILER_MAX_OUTPUT_CHARS: ${COMPILER_MAX_OUTPUT_CHARS:-30000}
      COMPILER_MAX_OUTPUT_TOKENS: ${COMPILER_MAX_OUTPUT_TOKENS:-8192}
      COMPILATION_MAX_ATTEMPTS: ${COMPILATION_MAX_ATTEMPTS:-3}
      SCRAPE_MAX_ATTEMPTS: ${SCRAPE_MAX_ATTEMPTS:-3}
      SCRAPE_RETRY_DELAY_MS: ${SCRAPE_RETRY_DELAY_MS:-5000}
      EXTRACTION_CONFIRMATION_DELAY_MS: ${EXTRACTION_CONFIRMATION_DELAY_MS:-900000}
      RECOVERY_WINDOW_MS: ${RECOVERY_WINDOW_MS:-86400000}
      RUN_MAX_DURATION_MS: ${RUN_MAX_DURATION_MS:-3600000}
      RUN_RECONCILE_INTERVAL_MS: ${RUN_RECONCILE_INTERVAL_MS:-60000}
      COMPILATION_QUEUE_MAX_ATTEMPTS: ${COMPILATION_QUEUE_MAX_ATTEMPTS:-3}
      MAX_RECOVERY_ATTEMPTS: ${MAX_RECOVERY_ATTEMPTS:-3}
      DEFAULT_MAX_ACTIVE_MONITORS: ${DEFAULT_MAX_ACTIVE_MONITORS:-5}
      DEFAULT_MAX_MONTHLY_COMPILATIONS: ${DEFAULT_MAX_MONTHLY_COMPILATIONS:-20}
      DEFAULT_MAX_MONTHLY_EXECUTIONS: ${DEFAULT_MAX_MONTHLY_EXECUTIONS:-1000}
    ports:
      - '3001:3001'
    volumes:
      - ./backend:/app
      - ./packages/contracts:/packages/contracts
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    container_name: specter-frontend-dev
    restart: unless-stopped
    command: ['npm', 'run', 'dev']
    environment:
      NODE_ENV: development
      HOSTNAME: '0.0.0.0'
      PORT: '3000'
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_EXTENSION_URL: ${NEXT_PUBLIC_EXTENSION_URL:-}
      WATCHPACK_POLLING: 'true'
    ports:
      - '3005:3000'
    volumes:
      - ./frontend:/app
      - ./packages/contracts:/packages/contracts
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_dev_data:
  redis_dev_data:
