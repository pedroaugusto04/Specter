x-default-logging: &default-logging
  driver: 'json-file'
  options:
    max-size: '${DOCKER_LOG_MAX_SIZE:-10m}'
    max-file: '${DOCKER_LOG_MAX_FILE:-5}'

services:
  postgres:
    image: postgres:16-alpine
    container_name: specter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-specter}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-specter}']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - specter-net

  redis:
    image: redis:7-alpine
    container_name: specter-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - specter-net

  backend:
    labels:
      vigil.repo: pedroaugusto04/Specter
    # Set DOCKER_IMAGE in the deployment environment, for example in .env.prod.
    image: ${DOCKER_IMAGE}
    container_name: specter-backend
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: ${BACKEND_MEM_LIMIT:-2g}
    stop_grace_period: 20m
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-specter}
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REALTIME_REDIS_TIMEOUT_MS: ${REALTIME_REDIS_TIMEOUT_MS:-5000}
      COMPILER_PROVIDER: ${COMPILER_PROVIDER:-api}
      COMPILER_API_MODEL: ${COMPILER_API_MODEL:-}
      COMPILER_API_KEY: ${COMPILER_API_KEY:-}
      COMPILER_API_BASE_URL: ${COMPILER_API_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      COMPILER_TIMEOUT_MS: ${COMPILER_TIMEOUT_MS:-900000}
      COMPILATION_BUDGET_MS: ${COMPILATION_BUDGET_MS:-900000}
      PLAYWRIGHT_TIMEOUT_MS: ${PLAYWRIGHT_TIMEOUT_MS:-60000}
      HTTP_MAX_RESPONSE_BYTES: ${HTTP_MAX_RESPONSE_BYTES:-10485760}
      RATE_LIMIT_PROBE_MAX: ${RATE_LIMIT_PROBE_MAX:-10}
      EXTRACTION_ACTION_TIMEOUT_MS: ${EXTRACTION_ACTION_TIMEOUT_MS:-20000}
      CONFIGURATION_MAX_DECISIONS: ${CONFIGURATION_MAX_DECISIONS:-6}
      CONFIGURATION_MAX_INPUT_CHARS: ${CONFIGURATION_MAX_INPUT_CHARS:-250000}
      CONFIGURATION_REVIEW_RESERVE_MS: ${CONFIGURATION_REVIEW_RESERVE_MS:-30000}
      COMPILER_MAX_OUTPUT_CHARS: ${COMPILER_MAX_OUTPUT_CHARS:-30000}
      COMPILER_MAX_OUTPUT_TOKENS: ${COMPILER_MAX_OUTPUT_TOKENS:-8192}
      COMPILATION_MAX_ATTEMPTS: ${COMPILATION_MAX_ATTEMPTS:-3}
      SCRAPE_MAX_ATTEMPTS: ${SCRAPE_MAX_ATTEMPTS:-3}
      SCRAPE_RETRY_DELAY_MS: ${SCRAPE_RETRY_DELAY_MS:-5000}
      EXTRACTION_CONFIRMATION_DELAY_MS: ${EXTRACTION_CONFIRMATION_DELAY_MS:-900000}
      RECOVERY_WINDOW_MS: ${RECOVERY_WINDOW_MS:-86400000}
      RUN_MAX_DURATION_MS: ${RUN_MAX_DURATION_MS:-3600000}
      RUN_RECONCILE_INTERVAL_MS: ${RUN_RECONCILE_INTERVAL_MS:-60000}
      COMPILATION_QUEUE_MAX_ATTEMPTS: ${COMPILATION_QUEUE_MAX_ATTEMPTS:-3}
      MAX_RECOVERY_ATTEMPTS: ${MAX_RECOVERY_ATTEMPTS:-3}
      CODEX_CLI_PATH: /usr/local/bin/codex
      COMPILER_CODEX_MODEL: ${COMPILER_CODEX_MODEL:-}
      COMPILER_CODEX_SANDBOX: ${COMPILER_CODEX_SANDBOX:-read-only}
      CHROME_EXTENSION_ID: ${CHROME_EXTENSION_ID:-}
      CODEX_HOME: /codex
      AGY_CLI_PATH: ${AGY_CLI_PATH:-/usr/local/bin/agy}
      AGY_MODEL: ${AGY_MODEL:-}
    ports:
      - '${BIND_HOST:-0.0.0.0}:${PORT:-3001}:3001'
    volumes:
      - compiler_jobs:/tmp/scraper_jobs
      - ${CODEX_HOST_DIR:-/srv/specter-codex}:/codex
      - ${AGY_BIN_PATH:-/srv/specter-agy/bin/agy}:/usr/local/bin/agy:ro
      - ${AGY_HOST_DIR:-/srv/specter-agy/data}:/home/node/.gemini
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging
    networks:
      - specter-net

networks:
  specter-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  compiler_jobs:
