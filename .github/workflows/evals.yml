name: Pipeline regression evals

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'packages/contracts/**'
      - '.github/workflows/evals.yml'
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'packages/contracts/**'
      - '.github/workflows/evals.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      LOG_LEVEL: silent
      ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      NOTIFICATION_PROVIDER: console
      COMPILER_PROVIDER: agy
      EVALS_LIVE_MODELS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Install test browser
        run: |
          sudo bash -c 'echo -e "Acquire::Retries \"5\";\nAcquire::http::Timeout \"60\";" > /etc/apt/apt.conf.d/80-retries' || true
          for attempt in 1 2 3; do
            echo "Installing Playwright browser and dependencies (attempt $attempt/3)..."
            if sudo apt-get update --fix-missing && npx playwright install --with-deps chromium; then
              echo "Playwright installed successfully."
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Playwright installation failed after 3 attempts."
              exit 1
            fi
            echo "Attempt $attempt failed. Retrying in 10s..."
            sleep 10
          done
      - run: npm run build
      - run: npm run evaluate:regression
      - name: Behavioral and browser integration tests
        if: ${{ !cancelled() }}
        run: npm test -- --reporter=default --reporter=junit --outputFile=reports/evals/behavior.xml
      - name: Upload evaluation reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-evals-${{ github.sha }}
          path: backend/reports/evals/
          if-no-files-found: warn
