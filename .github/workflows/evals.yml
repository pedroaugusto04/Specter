name: Pipeline regression evals

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'extension/**'
      - 'backend/**'
      - 'packages/contracts/**'
      - '.github/workflows/evals.yml'
  push:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - 'extension/**'
      - 'backend/**'
      - 'packages/contracts/**'
      - '.github/workflows/evals.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      LOG_LEVEL: silent
      ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      NOTIFICATION_PROVIDER: console
      COMPILER_PROVIDER: agy
      EVALS_LIVE_MODELS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run evaluate:regression
      - name: CI behavioral tests (live models and browser suite disabled)
        if: ${{ !cancelled() }}
        run: npm run test:ci -- --reporter=default --reporter=junit --outputFile=reports/evals/behavior.xml
      - name: Upload evaluation reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-evals-${{ github.sha }}
          path: backend/reports/evals/
          if-no-files-found: warn

  frontend:
    name: Frontend types and production export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
