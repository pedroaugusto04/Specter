name: Deploy Fullstack

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'packages/contracts/**'
      - 'extension/**'
      - 'scripts/deploy/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy-fullstack.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Component to deploy / Componente para deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - backend
          - frontend

concurrency:
  group: deploy-fullstack-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  APP_NAME: ${{ vars.APP_NAME || 'Specter' }}
  APP_DIR_NAME: ${{ vars.APP_DIR_NAME || 'specter' }}
  FRONTEND_DEPLOY_PATH: ${{ vars.FRONTEND_DEPLOY_PATH || '/var/www/specter' }}
  RELOAD_NGINX: ${{ vars.RELOAD_NGINX || 'true' }}
  DOCKER_PLATFORMS: ${{ vars.DOCKER_PLATFORMS || 'linux/arm64' }}
  APP_PORT: ${{ vars.PORT || '3001' }}
  CORS_ORIGIN: ${{ vars.CORS_ORIGIN || 'https://specterdev.online,http://specterdev.online,https://www.specterdev.online,http://www.specterdev.online,https://pedro-duarte.ddns.net,http://pedro-duarte.ddns.net,https://pedro-duarte.servehttp.com,http://pedro-duarte.servehttp.com' }}
  NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH || '' }}
  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || '/api' }}
  NEXT_PUBLIC_EXTENSION_URL: ${{ vars.NEXT_PUBLIC_EXTENSION_URL || '' }}
  SEMANTIC_REVIEW_ENABLED: ${{ vars.SEMANTIC_REVIEW_ENABLED || 'true' }}
  SEMANTIC_REVIEW_THRESHOLD: ${{ vars.SEMANTIC_REVIEW_THRESHOLD || '4' }}
  EXTRACTION_ACTION_TIMEOUT_MS: ${{ vars.EXTRACTION_ACTION_TIMEOUT_MS || '120000' }}
  EXTRACTION_POLL_INTERVAL_MS: ${{ vars.EXTRACTION_POLL_INTERVAL_MS || '250' }}
  EXTRACTION_MAX_EVIDENCE: ${{ vars.EXTRACTION_MAX_EVIDENCE || '200' }}
  EXTRACTION_EVIDENCE_RETENTION_DAYS: ${{ vars.EXTRACTION_EVIDENCE_RETENTION_DAYS || '7' }}
  CONFIGURATION_MAX_DECISIONS: ${{ vars.CONFIGURATION_MAX_DECISIONS || '10' }}
  CONFIGURATION_REVIEW_RESERVE_MS: ${{ vars.CONFIGURATION_REVIEW_RESERVE_MS || '30000' }}
  COMPILER_MAX_OUTPUT_CHARS: ${{ vars.COMPILER_MAX_OUTPUT_CHARS || '30000' }}
  COMPILER_MAX_OUTPUT_TOKENS: ${{ vars.COMPILER_MAX_OUTPUT_TOKENS || '8192' }}
  NOTIFICATION_TIMEOUT_MS: ${{ vars.NOTIFICATION_TIMEOUT_MS || '30000' }}
  NOTIFICATION_MAX_ATTEMPTS: ${{ vars.NOTIFICATION_MAX_ATTEMPTS || '5' }}
  EXTRACTION_MAX_PAGES: ${{ vars.EXTRACTION_MAX_PAGES || '10' }}
  EXTRACTION_MAX_ACTIONS: ${{ vars.EXTRACTION_MAX_ACTIONS || '20' }}
  EXTRACTION_MAX_ITEMS: ${{ vars.EXTRACTION_MAX_ITEMS || '500' }}
  ACQUISITION_MAX_ATTEMPTS: ${{ vars.ACQUISITION_MAX_ATTEMPTS || '6' }}
  ACCESS_BLOCK_THRESHOLD: ${{ vars.ACCESS_BLOCK_THRESHOLD || '2' }}
  ACCESS_BLOCK_COOLDOWN_MINUTES: ${{ vars.ACCESS_BLOCK_COOLDOWN_MINUTES || '60' }}
  EXTRACTION_TIMEOUT_MS: ${{ vars.EXTRACTION_TIMEOUT_MS || '300000' }}
  COMPILATION_BUDGET_MS: ${{ vars.COMPILATION_BUDGET_MS || '600000' }}
  COMPILATION_MAX_ATTEMPTS: ${{ vars.COMPILATION_MAX_ATTEMPTS || '3' }}
  SCRAPE_MAX_ATTEMPTS: ${{ vars.SCRAPE_MAX_ATTEMPTS || '3' }}
  SCRAPE_RETRY_DELAY_MS: ${{ vars.SCRAPE_RETRY_DELAY_MS || '5000' }}
  EXTRACTION_CONFIRMATION_DELAY_MS: ${{ vars.EXTRACTION_CONFIRMATION_DELAY_MS || '900000' }}
  RUN_MAX_DURATION_MS: ${{ vars.RUN_MAX_DURATION_MS || '3600000' }}
  RUN_RECONCILE_INTERVAL_MS: ${{ vars.RUN_RECONCILE_INTERVAL_MS || '60000' }}
  COMPILATION_QUEUE_MAX_ATTEMPTS: ${{ vars.COMPILATION_QUEUE_MAX_ATTEMPTS || '3' }}
  CONFIGURATION_MAX_INPUT_CHARS: ${{ vars.CONFIGURATION_MAX_INPUT_CHARS || '250000' }}
  COMPILATION_DIAGNOSTICS_ENABLED: ${{ vars.COMPILATION_DIAGNOSTICS_ENABLED || 'true' }}
  COMPILATION_DIAGNOSTICS_MAX_CHARS: ${{ vars.COMPILATION_DIAGNOSTICS_MAX_CHARS || '30000' }}
  RECOVERY_WINDOW_MS: ${{ vars.RECOVERY_WINDOW_MS || '86400000' }}
  MAX_RECOVERY_ATTEMPTS: ${{ vars.MAX_RECOVERY_ATTEMPTS || '3' }}
  COMPILER_PROVIDER: ${{ vars.COMPILER_PROVIDER || 'codex' }}
  COMPILER_API_MODEL: ${{ vars.COMPILER_API_MODEL || '' }}
  AGY_MODEL: ${{ vars.AGY_MODEL || '' }}
  COMPILER_CODEX_MODEL: ${{ vars.COMPILER_CODEX_MODEL || 'gpt-6-luna' }}
  COMPILER_API_BASE_URL: ${{ vars.COMPILER_API_BASE_URL || 'https://generativelanguage.googleapis.com/v1beta' }}
  COMPILER_API_MAX_RETRIES: ${{ vars.COMPILER_API_MAX_RETRIES || '3' }}
  COMPILER_API_RETRY_BASE_DELAY_MS: ${{ vars.COMPILER_API_RETRY_BASE_DELAY_MS || '1000' }}
  COMPILER_API_RETRY_MAX_DELAY_MS: ${{ vars.COMPILER_API_RETRY_MAX_DELAY_MS || '10000' }}
  COMPILER_RATE_LIMIT_RETRY_DELAY_MS: ${{ vars.COMPILER_RATE_LIMIT_RETRY_DELAY_MS || '120000' }}
  EVALS_LIVE_MODELS_ENABLED: ${{ vars.EVALS_LIVE_MODELS_ENABLED || 'false' }}
  HTTP_MAX_RESPONSE_BYTES: ${{ vars.HTTP_MAX_RESPONSE_BYTES || '10485760' }}
  RATE_LIMIT_PROBE_MAX: ${{ vars.RATE_LIMIT_PROBE_MAX || '10' }}
  SCRAPER_ENGINE: ${{ vars.SCRAPER_ENGINE || 'playwright' }}
  SCRAPER_CONCURRENCY: ${{ vars.SCRAPER_CONCURRENCY || '3' }}
  PLAYWRIGHT_TIMEOUT_MS: ${{ vars.PLAYWRIGHT_TIMEOUT_MS || '120000' }}
  UNBLOCKER_TIMEOUT_MS: ${{ vars.UNBLOCKER_TIMEOUT_MS || '120000' }}
  COMPILER_TIMEOUT_MS: ${{ vars.COMPILER_TIMEOUT_MS || '600000' }}
  NOTIFICATION_PROVIDER: ${{ vars.NOTIFICATION_PROVIDER || 'resend' }}
  NOTIFICATION_FROM_EMAIL: ${{ vars.NOTIFICATION_FROM_EMAIL || 'noreply@mail.specterdev.online' }}
  MIN_CRON_INTERVAL_MINUTES: ${{ vars.MIN_CRON_INTERVAL_MINUTES || '15' }}
  SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STORAGE_BUCKET || 'specter-screenshots' }}
  DOCKER_LOG_MAX_SIZE: ${{ vars.DOCKER_LOG_MAX_SIZE || '10m' }}
  DOCKER_LOG_MAX_FILE: ${{ vars.DOCKER_LOG_MAX_FILE || '5' }}

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.set-outputs.outputs.backend }}
      frontend: ${{ steps.set-outputs.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        if: ${{ github.event_name != 'workflow_dispatch' }}
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'packages/contracts/**'
              - 'scripts/deploy/**'
              - 'docker-compose.prod.yml'
              - '.github/workflows/deploy-fullstack.yml'
            frontend:
              - 'frontend/**'
              - 'extension/**'
              - 'packages/contracts/**'
              - '.github/workflows/deploy-fullstack.yml'

      - name: Determine target components
        id: set-outputs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.target }}"
            if [ "$TARGET" = "all" ]; then
              echo "backend=true" >> "$GITHUB_OUTPUT"
              echo "frontend=true" >> "$GITHUB_OUTPUT"
            elif [ "$TARGET" = "backend" ]; then
              echo "backend=true" >> "$GITHUB_OUTPUT"
              echo "frontend=false" >> "$GITHUB_OUTPUT"
            elif [ "$TARGET" = "frontend" ]; then
              echo "backend=false" >> "$GITHUB_OUTPUT"
              echo "frontend=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "backend=${{ steps.filter.outputs.backend }}" >> "$GITHUB_OUTPUT"
            echo "frontend=${{ steps.filter.outputs.frontend }}" >> "$GITHUB_OUTPUT"
          fi

  deploy-backend:
    name: Build Docker & Deploy Backend to VPS
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund

      - name: Check backend build and lint
        working-directory: backend
        env:
          EVALS_LIVE_MODELS_ENABLED: 'false'
        run: |
          npm run typecheck
          npm run build
          npm run lint
          npm run evaluate:regression

      - name: Run backend tests
        working-directory: backend
        env:
          NODE_ENV: test
          NOTIFICATION_PROVIDER: console
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || vars.RESEND_API_KEY || 're_test_dummy_key' }}
          NOTIFICATION_FROM_EMAIL: ${{ env.NOTIFICATION_FROM_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || vars.TELEGRAM_BOT_TOKEN }}
        run: |
          npm run test:ci

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKERHUB_USERNAME != '' && 'docker.io' || 'ghcr.io' }}
          username: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_USERNAME || github.actor }}
          password: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image names
        id: image_meta
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            RAW_REPO="${{ secrets.DOCKERHUB_USERNAME }}/specter-backend"
          else
            RAW_REPO="ghcr.io/${{ github.repository_owner }}/specter-backend"
          fi
          LOWER_REPO=$(echo "$RAW_REPO" | tr '[:upper:]' '[:lower:]')
          echo "image_repo=$LOWER_REPO" >> "$GITHUB_OUTPUT"
          echo "image_latest=$LOWER_REPO:latest" >> "$GITHUB_OUTPUT"
          echo "image_sha=$LOWER_REPO:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: ${{ contains(env.DOCKER_PLATFORMS, 'arm64') }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          platforms: ${{ env.DOCKER_PLATFORMS }}
          tags: |
            ${{ steps.image_meta.outputs.image_latest }}
            ${{ steps.image_meta.outputs.image_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ensure rsync is available on GitHub runner
        run: |
          if ! command -v rsync >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y rsync
          fi

      - name: Generate backend env file
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || vars.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB || vars.POSTGRES_DB }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REALTIME_REDIS_TIMEOUT_MS: ${{ vars.REALTIME_REDIS_TIMEOUT_MS }}
          CORS_ORIGIN: ${{ env.CORS_ORIGIN }}
          SEMANTIC_REVIEW_ENABLED: ${{ env.SEMANTIC_REVIEW_ENABLED }}
          SEMANTIC_REVIEW_THRESHOLD: ${{ env.SEMANTIC_REVIEW_THRESHOLD }}
          EXTRACTION_ACTION_TIMEOUT_MS: ${{ env.EXTRACTION_ACTION_TIMEOUT_MS }}
          EXTRACTION_POLL_INTERVAL_MS: ${{ env.EXTRACTION_POLL_INTERVAL_MS }}
          EXTRACTION_MAX_EVIDENCE: ${{ env.EXTRACTION_MAX_EVIDENCE }}
          EXTRACTION_EVIDENCE_RETENTION_DAYS: ${{ env.EXTRACTION_EVIDENCE_RETENTION_DAYS }}
          CONFIGURATION_MAX_DECISIONS: ${{ env.CONFIGURATION_MAX_DECISIONS }}
          CONFIGURATION_REVIEW_RESERVE_MS: ${{ env.CONFIGURATION_REVIEW_RESERVE_MS }}
          COMPILER_MAX_OUTPUT_CHARS: ${{ env.COMPILER_MAX_OUTPUT_CHARS }}
          COMPILER_MAX_OUTPUT_TOKENS: ${{ env.COMPILER_MAX_OUTPUT_TOKENS }}
          NOTIFICATION_TIMEOUT_MS: ${{ env.NOTIFICATION_TIMEOUT_MS }}
          NOTIFICATION_MAX_ATTEMPTS: ${{ env.NOTIFICATION_MAX_ATTEMPTS }}
          EXTRACTION_MAX_PAGES: ${{ env.EXTRACTION_MAX_PAGES }}
          EXTRACTION_MAX_ACTIONS: ${{ env.EXTRACTION_MAX_ACTIONS }}
          EXTRACTION_MAX_ITEMS: ${{ env.EXTRACTION_MAX_ITEMS }}
          ACQUISITION_MAX_ATTEMPTS: ${{ env.ACQUISITION_MAX_ATTEMPTS }}
          ACCESS_BLOCK_THRESHOLD: ${{ env.ACCESS_BLOCK_THRESHOLD }}
          ACCESS_BLOCK_COOLDOWN_MINUTES: ${{ env.ACCESS_BLOCK_COOLDOWN_MINUTES }}
          EXTRACTION_TIMEOUT_MS: ${{ env.EXTRACTION_TIMEOUT_MS }}
          COMPILATION_BUDGET_MS: ${{ env.COMPILATION_BUDGET_MS }}
          COMPILATION_MAX_ATTEMPTS: ${{ env.COMPILATION_MAX_ATTEMPTS }}
          SCRAPE_MAX_ATTEMPTS: ${{ env.SCRAPE_MAX_ATTEMPTS }}
          SCRAPE_RETRY_DELAY_MS: ${{ env.SCRAPE_RETRY_DELAY_MS }}
          EXTRACTION_CONFIRMATION_DELAY_MS: ${{ env.EXTRACTION_CONFIRMATION_DELAY_MS }}
          RUN_MAX_DURATION_MS: ${{ env.RUN_MAX_DURATION_MS }}
          RUN_RECONCILE_INTERVAL_MS: ${{ env.RUN_RECONCILE_INTERVAL_MS }}
          COMPILATION_QUEUE_MAX_ATTEMPTS: ${{ env.COMPILATION_QUEUE_MAX_ATTEMPTS }}
          CONFIGURATION_MAX_INPUT_CHARS: ${{ env.CONFIGURATION_MAX_INPUT_CHARS }}
          COMPILATION_DIAGNOSTICS_ENABLED: ${{ env.COMPILATION_DIAGNOSTICS_ENABLED }}
          COMPILATION_DIAGNOSTICS_MAX_CHARS: ${{ env.COMPILATION_DIAGNOSTICS_MAX_CHARS }}
          RECOVERY_WINDOW_MS: ${{ env.RECOVERY_WINDOW_MS }}
          MAX_RECOVERY_ATTEMPTS: ${{ env.MAX_RECOVERY_ATTEMPTS }}
          COMPILER_PROVIDER: ${{ env.COMPILER_PROVIDER }}
          COMPILER_API_MODEL: ${{ env.COMPILER_API_MODEL }}
          AGY_MODEL: ${{ env.AGY_MODEL }}
          COMPILER_CODEX_MODEL: ${{ env.COMPILER_CODEX_MODEL }}
          COMPILER_API_KEY: ${{ secrets.COMPILER_API_KEY }}
          COMPILER_API_BASE_URL: ${{ env.COMPILER_API_BASE_URL }}
          COMPILER_API_MAX_RETRIES: ${{ env.COMPILER_API_MAX_RETRIES }}
          COMPILER_API_RETRY_BASE_DELAY_MS: ${{ env.COMPILER_API_RETRY_BASE_DELAY_MS }}
          COMPILER_API_RETRY_MAX_DELAY_MS: ${{ env.COMPILER_API_RETRY_MAX_DELAY_MS }}
          COMPILER_RATE_LIMIT_RETRY_DELAY_MS: ${{ env.COMPILER_RATE_LIMIT_RETRY_DELAY_MS }}
          EVALS_LIVE_MODELS_ENABLED: ${{ env.EVALS_LIVE_MODELS_ENABLED }}
          NOTIFICATION_PROVIDER: ${{ vars.NOTIFICATION_PROVIDER || env.NOTIFICATION_PROVIDER }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || vars.RESEND_API_KEY }}
          NOTIFICATION_FROM_EMAIL: ${{ vars.NOTIFICATION_FROM_EMAIL || env.NOTIFICATION_FROM_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || vars.TELEGRAM_BOT_TOKEN }}
          SCRAPER_ENGINE: ${{ env.SCRAPER_ENGINE }}
          SCRAPER_CONCURRENCY: ${{ env.SCRAPER_CONCURRENCY }}
          PLAYWRIGHT_TIMEOUT_MS: ${{ env.PLAYWRIGHT_TIMEOUT_MS }}
          UNBLOCKER_TIMEOUT_MS: ${{ env.UNBLOCKER_TIMEOUT_MS }}
          HTTP_MAX_RESPONSE_BYTES: ${{ env.HTTP_MAX_RESPONSE_BYTES }}
          RATE_LIMIT_PROBE_MAX: ${{ env.RATE_LIMIT_PROBE_MAX }}
          COMPILER_TIMEOUT_MS: ${{ env.COMPILER_TIMEOUT_MS }}
          MIN_CRON_INTERVAL_MINUTES: ${{ env.MIN_CRON_INTERVAL_MINUTES }}
          DEFAULT_MAX_ACTIVE_MONITORS: ${{ vars.DEFAULT_MAX_ACTIVE_MONITORS || '5' }}
          DEFAULT_MAX_MONTHLY_COMPILATIONS: ${{ vars.DEFAULT_MAX_MONTHLY_COMPILATIONS || '20' }}
          DEFAULT_MAX_MONTHLY_EXECUTIONS: ${{ vars.DEFAULT_MAX_MONTHLY_EXECUTIONS || '1000' }}
          DOCKER_LOG_MAX_SIZE: ${{ env.DOCKER_LOG_MAX_SIZE }}
          DOCKER_LOG_MAX_FILE: ${{ env.DOCKER_LOG_MAX_FILE }}
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          CRAWLBASE_TOKEN: ${{ secrets.CRAWLBASE_TOKEN }}
          DECODO_API_KEY: ${{ secrets.DECODO_API_KEY }}
          HTTP_PROXY: ${{ secrets.HTTP_PROXY || vars.HTTP_PROXY }}
          HTTP_FALLBACK_PROXY: ${{ secrets.HTTP_FALLBACK_PROXY || vars.HTTP_FALLBACK_PROXY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          COOKIE_SECURE: ${{ vars.COOKIE_SECURE }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://specterdev.online' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL: ${{ vars.GOOGLE_CALLBACK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STORAGE_BUCKET || env.SUPABASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_EXTENSION_URL: ${{ env.NEXT_PUBLIC_EXTENSION_URL }}
        run: |
          bash scripts/deploy/generate-backend-env.sh .deploy/backend.env 3001

      - name: Prepare SSH for VPS sync
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          APP_DIR_NAME: ${{ env.APP_DIR_NAME }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 22 -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p 22 -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" \
            "command -v rsync >/dev/null 2>&1 || { echo 'rsync nao encontrado no servidor remoto'; exit 1; }; mkdir -p ~/$APP_DIR_NAME /tmp/scraper_jobs"

      - name: Sync backend deploy assets to VPS
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          APP_DIR_NAME: ${{ env.APP_DIR_NAME }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p 22 -o StrictHostKeyChecking=yes" \
            .deploy/backend.env "$SERVER_USER@$SERVER_HOST:~/$APP_DIR_NAME/backend.env"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p 22 -o StrictHostKeyChecking=yes" \
            docker-compose.prod.yml "$SERVER_USER@$SERVER_HOST:~/$APP_DIR_NAME/docker-compose.prod.yml"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.4
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          BACKEND_IMAGE: ${{ steps.image_meta.outputs.image_sha }}
          APP_DIR_NAME: ${{ env.APP_DIR_NAME }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          command_timeout: 30m
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,GHCR_TOKEN,GH_ACTOR,BACKEND_IMAGE,APP_DIR_NAME
          script: |
            set -euo pipefail
            COMPOSE_FILE="docker-compose.prod.yml"

            mkdir -p ~/${APP_DIR_NAME}
            cd ~/${APP_DIR_NAME} || exit 1
            chmod 600 backend.env
            cp backend.env .env.prod
            echo "DOCKER_IMAGE=$BACKEND_IMAGE" >> .env.prod

            if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
              echo "$DOCKERHUB_TOKEN" | sudo docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            elif [ -n "${GHCR_TOKEN:-}" ]; then
              echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "${GH_ACTOR:-}" --password-stdin
            fi

            sudo docker pull "$BACKEND_IMAGE"
            # Drain existing workers before the new execution-contract migration.
            sudo env DOCKER_IMAGE="$BACKEND_IMAGE" docker compose --env-file .env.prod -f "$COMPOSE_FILE" stop --timeout 1200 backend
            sudo env DOCKER_IMAGE="$BACKEND_IMAGE" docker compose --env-file .env.prod -f "$COMPOSE_FILE" up -d --remove-orphans

            # Wait for migrations and API initialization before deploying the frontend.
            for attempt in $(seq 1 60); do
              if sudo docker exec specter-backend node -e "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                break
              fi
              if [ "$attempt" = "60" ]; then
                sudo docker logs --tail 100 specter-backend
                exit 1
              fi
              sleep 3
            done

            # Limpa imagens antigas (mais de 7 dias)
            sudo docker image prune -a -f --filter "until=168h"

  deploy-frontend:
    name: Build & Deploy Frontend to VPS
    runs-on: ubuntu-latest
    needs: [changes, deploy-backend]
    if: ${{ always() && needs.changes.outputs.frontend == 'true' && (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') }}
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund

      - name: Package companion extension artifact
        run: |
          if [ -d "extension" ] && command -v zip >/dev/null 2>&1; then
            mkdir -p frontend/public
            (cd extension && zip -qr ../frontend/public/specter-companion.zip . -x "specter-companion.zip") || true
          fi

      - name: Build frontend static export
        working-directory: frontend
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ env.NEXT_PUBLIC_BASE_PATH }}
          NEXT_PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_EXTENSION_URL: ${{ env.NEXT_PUBLIC_EXTENSION_URL }}
        run: |
          npm run build

      - name: Ensure rsync is available on GitHub runner
        run: |
          if ! command -v rsync >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y rsync
          fi

      - name: Prepare SSH for VPS sync
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          APP_DIR_NAME: ${{ env.APP_DIR_NAME }}
          FRONTEND_DEPLOY_PATH: ${{ env.FRONTEND_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 22 -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p 22 -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" \
            "command -v rsync >/dev/null 2>&1 || { echo 'rsync nao encontrado no servidor remoto'; exit 1; }; sudo mkdir -p \"$FRONTEND_DEPLOY_PATH\" && sudo chown -R $SERVER_USER:$SERVER_USER \"$FRONTEND_DEPLOY_PATH\""

      - name: Sync frontend export to VPS
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          FRONTEND_DEPLOY_PATH: ${{ env.FRONTEND_DEPLOY_PATH }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p 22 -o StrictHostKeyChecking=yes" \
            frontend/out/ "$SERVER_USER@$SERVER_HOST:$FRONTEND_DEPLOY_PATH/"

      - name: Reload Nginx on App VPS
        if: ${{ vars.RELOAD_NGINX != 'false' }}
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            if command -v nginx >/dev/null 2>&1 && systemctl list-unit-files | grep -q '^nginx.service'; then
              sudo nginx -t
              sudo systemctl reload nginx
            else
              echo "Nginx nao instalado; pulando reload."
            fi
