<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 328" width="1000" height="328" fill="none">
  <defs>
    <pattern id="dot-grid-light" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#D4D4D8" opacity="0.5" />
    </pattern>

    <filter id="card-shadow-light" x="-4%" y="-6%" width="108%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="rgba(9, 9, 11, 0.04)" />
    </filter>

    <marker id="arrow-light" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#71717A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </marker>

    <marker id="arrow-heal-light" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#D97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>

  <!-- Outer Canvas -->
  <rect x="0.5" y="0.5" width="999" height="327" rx="14" fill="#FAFAFA" stroke="#E4E4E7" stroke-width="1" />
  <rect x="1" y="1" width="998" height="326" rx="13.5" fill="url(#dot-grid-light)" />

  <!-- Right Runtime Group Container -->
  <rect x="692" y="24" width="272" height="280" rx="12" fill="#F4F4F5" stroke="#E4E4E7" stroke-width="1" />

  <!-- Main Horizontal Connectors (Spine y=78) -->
  <line x1="212" y1="78" x2="249" y2="78" stroke="#71717A" stroke-width="1.5" marker-end="url(#arrow-light)" />
  <line x1="432" y1="78" x2="469" y2="78" stroke="#71717A" stroke-width="1.5" marker-end="url(#arrow-light)" />
  <line x1="656" y1="78" x2="709" y2="78" stroke="#71717A" stroke-width="1.5" marker-end="url(#arrow-light)" />

  <!-- Runtime Vertical Connectors (x=828) -->
  <line x1="828" y1="112" x2="828" y2="132" stroke="#71717A" stroke-width="1.5" marker-end="url(#arrow-light)" />
  <line x1="828" y1="200" x2="828" y2="220" stroke="#71717A" stroke-width="1.5" marker-end="url(#arrow-light)" />

  <!-- Self-Healing Dashed Loop -->
  <!-- From Validate & Diff left edge (712, 168) down to Recovery Card right edge (622, 248) -->
  <path d="M 712 168 L 664 168 Q 652 168 652 180 L 652 236 Q 652 248 640 248 L 627 248"
        fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-heal-light)" />

  <!-- From Recovery Card left edge (376, 248) up into AI Compiler bottom (342, 128) -->
  <path d="M 376 248 L 354 248 Q 342 248 342 236 L 342 133"
        fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-heal-light)" />

  <!-- ==================== CARD 1: Target & Prompt ==================== -->
  <g filter="url(#card-shadow-light)">
    <rect x="36" y="28" width="176" height="100" rx="10" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1" />
  </g>
  <rect x="52" y="42" width="26" height="26" rx="6" fill="#F4F4F5" />
  <g transform="translate(57, 47)" stroke="#18181B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="8" r="6.5" />
    <path d="M1.5 8h13" />
    <path d="M8 1.5a9.5 9.5 0 0 1 2.6 6.5A9.5 9.5 0 0 1 8 14.5 9.5 9.5 0 0 1 5.4 8 9.5 9.5 0 0 1 8 1.5z" />
  </g>
  <text x="52" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#09090B">Target &amp; Prompt</text>
  <text x="52" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#64646D">Page URL + what to track</text>

  <!-- ==================== CARD 2: AI Compiler ==================== -->
  <g filter="url(#card-shadow-light)">
    <rect x="252" y="28" width="180" height="100" rx="10" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1" />
  </g>
  <rect x="268" y="42" width="26" height="26" rx="6" fill="#F4F4F5" />
  <g transform="translate(273, 47)" stroke="#18181B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="2.5 5 6 8.5 2.5 12" />
    <line x1="8" y1="12" x2="13.5" y2="12" />
  </g>
  <text x="268" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#09090B">AI Compiler</text>
  <text x="268" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#64646D">Inspects DOM &amp; builds plan</text>

  <!-- ==================== CARD 3: Extraction Plan ==================== -->
  <g filter="url(#card-shadow-light)">
    <rect x="472" y="28" width="184" height="100" rx="10" fill="#FFFFFF" stroke="#18181B" stroke-width="1.4" />
  </g>
  <rect x="488" y="42" width="26" height="26" rx="6" fill="#09090B" />
  <g transform="translate(487, 41)" stroke="#FAFAFA" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 11.5V8.5C8 8.22 8.22 8 8.5 8H11.5" />
    <path d="M16.5 8H19.5C19.78 8 20 8.22 20 8.5V11.5" />
    <path d="M8 16.5V19.5C8 19.78 8.22 20 8.5 20H11.5" />
    <path d="M16.5 20H19.5C19.78 20 20 19.78 20 19.5V16.5" />
    <circle cx="14" cy="14" r="1.7" fill="#FAFAFA" stroke="none" />
  </g>
  <text x="488" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#09090B">Extraction Plan</text>
  <text x="488" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#64646D">Selectors, schema &amp; rules</text>

  <!-- ==================== CARD 4: Scheduled Runner ==================== -->
  <g filter="url(#card-shadow-light)">
    <rect x="712" y="44" width="232" height="68" rx="9" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1" />
  </g>
  <rect x="728" y="64" width="28" height="28" rx="7" fill="#F4F4F5" />
  <g transform="translate(734, 70)" stroke="#18181B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="8" r="6.5" />
    <polyline points="8 4.5 8 8 10.5 9.5" />
  </g>
  <text x="768" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#09090B">Scheduled Runner</text>
  <text x="768" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#64646D">Playwright or HTTP engine</text>

  <!-- ==================== CARD 5: Validate & Diff ==================== -->
  <g filter="url(#card-shadow-light)">
    <rect x="712" y="134" width="232" height="66" rx="9" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1" />
  </g>
  <rect x="728" y="153" width="28" height="28" rx="7" fill="#F4F4F5" />
  <g transform="translate(734, 159)" stroke="#18181B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="2.5" width="7" height="11" rx="1.5" />
    <rect x="7" y="2.5" width="7" height="11" rx="1.5" fill="#F4F4F5" />
    <line x1="9.5" y1="6" x2="11.5" y2="6" />
    <line x1="9.5" y1="9.5" x2="11.5" y2="9.5" />
  </g>
  <text x="768" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#09090B">Validate &amp; Diff</text>
  <text x="768" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#64646D">Schema check + visual diff</text>

  <!-- ==================== CARD 6: Alerts ==================== -->
  <g filter="url(#card-shadow-light)">
    <rect x="712" y="222" width="232" height="64" rx="9" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1" />
  </g>
  <rect x="728" y="240" width="28" height="28" rx="7" fill="#F4F4F5" />
  <g transform="translate(734, 246)" stroke="#18181B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12.5 10.5H3.5c.8-1 1.2-2.2 1.2-4a3.3 3.3 0 0 1 6.6 0c0 1.8.4 3 1.2 4z" />
    <path d="M6.8 13a1.4 1.4 0 0 0 2.4 0" />
  </g>
  <text x="768" y="251" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#09090B">Alerts</text>
  <text x="768" y="269" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#64646D">Email · Telegram · Webhooks</text>

  <!-- ==================== RECOVERY CARD: Self-Healing ==================== -->
  <g filter="url(#card-shadow-light)">
    <rect x="376" y="216" width="246" height="64" rx="9" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="5 3" />
  </g>
  <rect x="392" y="234" width="28" height="28" rx="7" fill="#FEF3C7" />
  <g transform="translate(398, 240)" stroke="#D97706" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 4.5A5.8 5.8 0 0 0 3.2 6" />
    <polyline points="2.5 3 3 6.2 6.2 5.7" />
    <path d="M3 11.5A5.8 5.8 0 0 0 12.8 10" />
    <polyline points="13.5 13 13 9.8 9.8 10.3" />
  </g>
  <text x="432" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#92400E">Self-Healing Recovery</text>
  <text x="432" y="263" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.2" fill="#B45309">Re-compiles and updates the plan</text>
</svg>
